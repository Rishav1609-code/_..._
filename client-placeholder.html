<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Under Development | vXr Holdings</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="LOGO/vXr_FAVICON_bg-r.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0F0F0F;
            --text-main: #FEFEFE;
            --text-muted: #888888;
            --accent-gold: #C4A882;
            --accent-glow: rgba(196, 168, 130, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Background Glow */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Grid Pattern */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            opacity: 0.5;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Main Content Container */
        .container {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .eyebrow {
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
            animation: fadeUp 1s ease 0.2s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            animation: fadeUp 1s ease 0.4s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        p.description {
            font-size: clamp(1rem, 2vw, 1.15rem);
            color: var(--text-muted);
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 3rem auto;
            animation: fadeUp 1s ease 0.6s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Animated Loader/Indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            animation: fadeUp 1s ease 0.8s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .ping {
            position: relative;
            width: 10px;
            height: 10px;
        }

        .ping-dot {
            position: absolute;
            inset: 0;
            background-color: var(--accent-gold);
            border-radius: 50%;
        }

        .ping-wave {
            position: absolute;
            inset: -4px;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2.5); opacity: 0; }
        }

        .status-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #d1d1d1;
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 10;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 1s ease 1s forwards;
            opacity: 0;
        }

        .footer p {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .footer strong {
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ambient-glow { width: 500px; height: 500px; }
            .container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="bg-grid"></div>

    <main class="container">
        <div class="eyebrow">System Architecture in Progress</div>
        <h1>A New Digital Standard<br>is Emerging.</h1>
        <p class="description">
            We are currently engineering a high-performance, enterprise-grade digital experience for this brand. The full platform will be launched soon.
        </p>
        
        <div class="status-indicator">
            <div class="ping">
                <div class="ping-wave"></div>
                <div class="ping-dot"></div>
            </div>
            <span class="status-text">INITIALIZING INFRASTRUCTURE...</span>
        </div>
    </main>

    <footer class="footer">
        <p>Engineered & Secured by <a href="index.html" target="_blank" style="color: #FEFEFE; text-decoration: none; font-family: 'Outfit', sans-serif; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#C4A882'" onmouseout="this.style.color='#FEFEFE'">vXr Holdings</a></p>
    </footer>

    <!-- Optional: Smooth entrance script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Extracts domain name to personalize the page if needed
            // e.g. champaranhandijunction.vxrholdings.com
            const host = window.location.hostname;
            if(host && host !== 'localhost' && host !== '127.0.0.1') {
                console.log("Building architecture for:", host);
            }
        });
    </script>
</body>
</html>
